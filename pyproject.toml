[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-kernel"
version = "0.1.0"
description = "An operating-system kernel for LLM agents — scheduling, IPC, memory, supervisor, and deadlock detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Agent-OS Contributors" }
]
keywords = [
    "agents", "llm", "multi-agent", "operating-system",
    "scheduler", "ipc", "process-manager", "ai", "autonomous-agents"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
persistence = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "build>=1.0",
    "twine>=5.0",
]
all = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/your-org/agent-os"
Documentation = "https://github.com/your-org/agent-os#readme"
Repository = "https://github.com/your-org/agent-os"
"Bug Tracker" = "https://github.com/your-org/agent-os/issues"

[project.scripts]
agent-os = "agent_os.cli:main"

# ── Package discovery ──────────────────────────────────────────────────────────
# agent_os.sdk is physically inside src/agent_os/sdk/ — auto-discovered.

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_os*"]

[tool.setuptools.package-dir]
"" = "src"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["agent_os"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
